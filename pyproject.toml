[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentedu"
version = "0.1.0"
description = "AI 出题 / 自适应辅导 Agent:理解材料 → 规划路径 → 讲解 → 出题 → 判分 → 自适应"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
tutor = "tutor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
