name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 跑测试(全程离线,不需要 API Key)
        env:
          TUTOR_FAKE_LLM: "1"
        run: pytest
      - name: 端到端冒烟(离线模型跑完整辅导循环)
        env:
          TUTOR_FAKE_LLM: "1"
        run: |
          python -m tutor.cli --fake ingest examples/gradient_descent.md
          python -m tutor.cli --fake eval examples/gradient_descent.md --ability 0.4
